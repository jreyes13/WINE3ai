<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9F1239" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.55" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded container -->
  <rect width="96" height="96" x="2" y="2" rx="22" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Isometric 3D Cube / Triad Structure (The 3 dimensions: Soil, Climate, Grape) -->
  <g transform="translate(0, -1)">
    <!-- Top Facet (Climate / Atmosphere) -->
    <polygon points="50,16 78,32 50,48 22,32" fill="url(#facetTop)" stroke="#67E8F9" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Left Facet (Wine / Appellations) -->
    <polygon points="22,32 50,48 50,80 22,64" fill="url(#facetLeft)" stroke="#FDA4AF" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Right Facet (Terroir / Earth) -->
    <polygon points="50,48 78,32 78,64 50,80" fill="url(#facetRight)" stroke="#FDE68A" stroke-width="0.8" stroke-opacity="0.5" />

    <!-- Wine Glass silhouette inside the cube -->
    <!-- Bowl of wine glass -->
    <path d="M38,36 C38,53 47,58 50,58 C53,58 62,53 62,36 Z" fill="url(#wineGrad)" stroke="url(#goldGrad)" stroke-width="1.2" />
    
    <!-- Wine liquid surface shimmer -->
    <ellipse cx="50" cy="39" rx="10" ry="2.8" fill="#F43F5E" fill-opacity="0.75" />

    <!-- Stem of glass -->
    <line x1="50" y1="58" x2="50" y2="73" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Base of glass -->
    <line x1="41" y1="73" x2="59" y2="73" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />

    <!-- AI Neural Network Nodes & Constellation Lines -->
    <!-- Central intelligence node in the heart of wine -->
    <line x1="50" y1="46" x2="22" y2="32" stroke="#FDE68A" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.7" />
    <line x1="50" y1="46" x2="78" y2="32" stroke="#FDE68A" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.7" />
    <line x1="50" y1="46" x2="50" y2="16" stroke="#67E8F9" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.7" />
    <line x1="50" y1="46" x2="50" y2="80" stroke="#FBBF24" stroke-width="0.7" stroke-dasharray="1.5,1.5" stroke-opacity="0.7" />

    <!-- Corner Nodes -->
    <circle cx="50" cy="16" r="2.2" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="22" cy="32" r="2.2" fill="#F43F5E" />
    <circle cx="78" cy="32" r="2.2" fill="#FBBF24" />
    <circle cx="50" cy="80" r="2.2" fill="#D97706" />

    <!-- Central Glowing Core AI Node -->
    <circle cx="50" cy="46" r="3.2" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="50" cy="46" r="1.4" fill="#FFFFFF" />

    <!-- Subtle sparkle/accent at top-right (AI spark) -->
    <path d="M72,21 L73.2,25.2 L77.4,26.4 L73.2,27.6 L72,31.8 L70.8,27.6 L66.6,26.4 L70.8,25.2 Z" fill="#FDE68A" opacity="0.9" filter="url(#glow)" />
  </g>
</svg>